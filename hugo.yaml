baseURL: https://blog.lenhon.com/
languageCode: zh-CN
defaultContentLanguage: zh
title: xijiangzhu's Blog
theme:
  - PaperMod

enableRobotsTXT: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: 主页
      url: /
      weight: 5
    - name: 文章
      url: posts/
      weight: 10
    - name: 归档
      url: archives/
      weight: 15
    - name: 分类
      url: categories/
      weight: 20
    - name: 标签
      url: tags/
      weight: 25
    - name: 搜索
      identifier: search
      title: 搜索
      pre: >-
        <svg class="menu-search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      url: search/
      weight: 99
    - name: 关于
      url: about/
      weight: 30

params:
  env: production
  author: xijiangzhu
  assets:
    favicon: "/favicon.svg"
  description: >-
    xijiangzhu 的技术博客，记录 Linux 运维、云原生、数据库、网络排障与自动化实践，分享工作中的技术经验和学习笔记。
  images:
    - /images/avatar.jpg
  schema:
    publisherType: Person
    sameAs:
      - https://github.com/xijiangzhu
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: true 
  DateFormat: "2006年01月02日"

  homeInfoParams:
    #Title: "👋你好呀 ！(*￣▽￣*)ブ "
    Content: |
      👋 Welcome to my blog! ✨

      - 一个热爱技术、乐于记录与分享的人。
      
      - 不求深刻，但求坦诚与持续。
    #avatar: /images/avatar.jpg
  socialIcons:
    - name: github
      title: Github
      url: "https://github.com/xijiangzhu"
    - name: email
      title: 发送邮件
      url: "mailto:xijiangzhu@gmail.com"
    - name: rss
      title: RSS 订阅
      url: /index.xml

  busuanzi:
    enable: true

  fuseOpts:
    threshold: 0.2

  comments: true
  giscus:
    repo: xijiangzhu/hugo-blog
    repoId: "R_kgDOVKh0Uw"
    category: Announcements
    categoryId: "DIC_kwDOVKh0U84DIfVj"
    mapping: pathname
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: bottom
    theme: preferred_color_scheme
    lang: zh-CN
